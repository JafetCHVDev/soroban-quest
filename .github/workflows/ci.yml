name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found, skipping linting check."
          fi

      - name: Validate mission data
        run: npm run mission:validate

      - name: Run build
        run: npm run build

      - name: Check bundle size budgets
        run: |
          set -euo pipefail
          max_chunk_bytes=204800
          for chunk in dist/assets/*.js; do
            size=$(stat -c%s "$chunk")
            if [ "$size" -gt "$max_chunk_bytes" ]; then
              echo "Bundle budget exceeded: $chunk is ${size} bytes (limit ${max_chunk_bytes})"
              exit 1
            fi
          done

          app_shell=$(find dist/assets -maxdepth 1 -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)
          app_shell_size=${app_shell%% *}
          if [ "${app_shell_size:-0}" -gt "$max_chunk_bytes" ]; then
            echo "Initial app-shell budget exceeded: $app_shell"
            exit 1
          fi
          echo "Bundle budgets passed. Largest app shell: $app_shell"
